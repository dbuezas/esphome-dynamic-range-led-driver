# bp5758d bulb with dynamic_range and bp5758d_dither (temporal dithering).
# Adjust pins, channels and currents to your bulb.
esphome:
  name: bp5758d-dither-bulb

esp8266:
  board: esp01_1m

external_components:
  - source: github://dbuezas/esphome-dynamic-range-led-driver
    components: [dynamic_range, bp5758d_dither]

bp5758d:
  data_pin: GPIO4
  clock_pin: GPIO5

output:
  # The chip's own channels, as usual.
  - {platform: bp5758d, id: blue_raw, channel: 1, current: 16}
  - {platform: bp5758d, id: green_raw, channel: 2, current: 16}
  - {platform: bp5758d, id: red_raw, channel: 3, current: 16}
  - {platform: bp5758d, id: warm_raw, channel: 4, current: 26}
  - {platform: bp5758d, id: cold_raw, channel: 5, current: 26}
  # Dithering on each channel.
  - {platform: bp5758d_dither, id: blue_dith, output: blue_raw}
  - {platform: bp5758d_dither, id: green_dith, output: green_raw}
  - {platform: bp5758d_dither, id: red_dith, output: red_raw}
  - {platform: bp5758d_dither, id: warm_dith, output: warm_raw}
  - {platform: bp5758d_dither, id: cold_dith, output: cold_raw}
  # One dynamic_range output per channel, on top. The light uses these.
  - {platform: dynamic_range, id: blue, output: blue_dith}
  - {platform: dynamic_range, id: green, output: green_dith}
  - {platform: dynamic_range, id: red, output: red_dith}
  - {platform: dynamic_range, id: warm, output: warm_dith}
  - {platform: dynamic_range, id: cold, output: cold_dith}

light:
  - platform: rgbww
    name: Bulb
    red: red
    green: green
    blue: blue
    cold_white: cold
    warm_white: warm
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    color_interlock: true

switch:
  - platform: template
    name: Dynamic range
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: dynamic_range::set_enabled(true);
    turn_off_action:
      - lambda: dynamic_range::set_enabled(false);
  - platform: template
    name: Dithering
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: bp5758d_dither::set_enabled(true);
    turn_off_action:
      - lambda: bp5758d_dither::set_enabled(false);
