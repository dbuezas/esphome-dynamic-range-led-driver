# Athom GU10 RGBWW bulb (ESP8285) with esp8266_fine_pwm instead of
# esp8266_pwm: the same, with CPU-cycle steps. Adjust pins to your bulb.
esphome:
  name: fine-pwm-bulb

esp8266:
  board: esp8285

external_components:
  - source: github://dbuezas/esphome-dynamic-range-led-driver
    components: [esp8266_fine_pwm]

output:
  - {platform: esp8266_fine_pwm, id: red_output, pin: GPIO4}
  - {platform: esp8266_fine_pwm, id: green_output, pin: GPIO12}
  - {platform: esp8266_fine_pwm, id: blue_output, pin: GPIO14}
  - {platform: esp8266_fine_pwm, id: warm_white_output, pin: GPIO13}
  - {platform: esp8266_fine_pwm, id: white_output, pin: GPIO5}

light:
  - platform: rgbww
    name: Bulb
    red: red_output
    green: green_output
    blue: blue_output
    warm_white: warm_white_output
    cold_white: white_output
    cold_white_color_temperature: 6000 K
    warm_white_color_temperature: 3000 K
    color_interlock: true
